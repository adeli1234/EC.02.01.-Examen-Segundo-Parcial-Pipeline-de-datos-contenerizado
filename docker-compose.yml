version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: db
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - datamart_net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  hadoop:
    build:
      context: ./hadoop
    container_name: hadoop
    restart: always
    volumes:
      - ./:/data/input:ro
      - hadoop_output:/data/output
      - ./mapreduce:/mapreduce
    networks:
      - datamart_net

  api:
    build:
      context: ./api
    container_name: api
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
    volumes:
      - hadoop_output:/data/output:ro
      - ./scripts:/scripts
    depends_on:
      db:
        condition: service_healthy
    networks:
      - datamart_net

volumes:
  mysql_data:
  hadoop_output:

networks:
  datamart_net:
    driver: bridge